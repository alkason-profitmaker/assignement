; PlatformIO Configuration for PrintHub Station Display
; Hardware: ESP32 DevKit + ILI9341 2.8" TFT
; Cost: ~₹1200-1500

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    bblanchon/ArduinoJson@^6.21.0
    ricmoo/QRCode@^0.0.1

; TFT_eSPI configuration (ILI9341)
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; Upload settings
upload_speed = 921600

; OTA Update support (for future remote updates)
; upload_protocol = espota
; upload_port = printstation.local
