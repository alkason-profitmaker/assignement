name: printhub_community
description: Hyperlocal self-service printing platform for residential apartment societies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.0

  # PDF Processing
  pdf: ^3.11.0
  printing: ^5.13.0
  syncfusion_flutter_pdf: ^24.2.0

  # Image Processing
  image: ^4.3.0
  image_picker: ^1.1.0
  file_picker: ^8.0.0

  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Utilities
  path_provider: ^2.1.0
  share_plus: ^7.2.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Crypto for hashing
  crypto: ^3.0.3

  # UUID generation
  uuid: ^4.3.0

  # Date/Time utilities
  collection: ^1.18.0

  # Date formatting
  intl: ^0.19.0

  # Environment configuration
  flutter_dotenv: ^5.1.0

  # Dependency injection
  get_it: ^7.6.0
  injectable: ^2.3.0

  # Functional programming (Result types)
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env
    - .env.development
    - .env.staging
    - .env.production

