name: printhub_community
description: PrintHub Community - Self-service printing solution for residential societies
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & Backend
  supabase_flutter: ^2.3.0
  http: ^1.1.0
  dio: ^5.4.0

  # Authentication
  flutter_otp_text_field: ^1.1.1

  # Payments
  razorpay_flutter: ^1.3.5

  # File Handling
  file_picker: ^6.1.1
  pdf_render: ^1.4.6
  image: ^4.1.4
  path_provider: ^2.1.1
  mime: ^1.0.4

  # PDF Generation (Cover Page)
  pdf: ^3.10.7
  printing: ^5.11.1

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0

  # Forms & Validation
  reactive_forms: ^16.1.1

  # Navigation
  go_router: ^13.0.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.2
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  qr_flutter: ^4.1.0

  # Device Info
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1

  # Permissions
  permission_handler: ^11.1.0

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  mocktail: ^1.0.1
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
