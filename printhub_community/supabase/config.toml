# PrintHub Community Supabase Configuration

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["com.printhub.community://callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.external.phone]
enabled = true

[auth.sms.twilio]
enabled = false

[storage]
enabled = true
file_size_limit = "10MB"

[functions]
verify_jwt = true

[analytics]
enabled = true
port = 54327
